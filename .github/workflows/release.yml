name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NIX_CONFIG: "experimental-features = nix-command flakes"

jobs:
  build:
    name: Build drag
    # macos-13 (Intel) runners are retired; one arm runner builds both archs
    # via Rosetta instead of waiting on scarce Intel capacity.
    runs-on: macos-26
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Build
        run: |
          for arch in aarch64-darwin x86_64-darwin; do
            if nix build .#packages.$arch.drag --print-build-logs --show-trace; then
              cp result/bin/drag "drag-$arch"
              shasum -a 256 "drag-$arch" > "drag-$arch.sha256"
            else
              echo "::warning::Build failed for $arch; release will omit it"
            fi
            rm -f result
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: drag-binaries
          path: drag-*

  release:
    name: Create Release
    needs: build
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          pattern: drag-*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/drag-*
